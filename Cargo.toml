# Durability check for ClassicUO, as a mod (wasm32-wasip2 component). Standalone crate (own
# empty workspace), built as a wasm32-wasip2 cdylib; rlib so `cargo test` runs natively.
[workspace]

[package]
name = "durability-check"
version = "0.1.1"
edition = "2021"

[dependencies]
# Pinned SDK revision: its generated paths / types must match the client the mod loads into.
cuo-mod-sdk = { git = "https://github.com/ClassicUO/classicuo-mods-sdk", rev = "8f2adac" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
panic = "abort"
